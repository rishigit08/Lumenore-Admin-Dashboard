<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumenore — usage dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
/* ==========================================================================
   TOKENS
   Light palette on :root; dark overrides both via prefers-color-scheme and
   via [data-theme] so the in-page toggle can force either mode regardless
   of OS setting. Tier + status colors are stored as bare "r,g,b" triples so
   solid and faint (rgba) uses can be derived from a single token. Every
   component below reads color only through these variables — porting to a
   React/design-system component means swapping this block for your theme.
   ========================================================================== */
:root{
  --bg:#FFFFFF;
  --canvas:#FAFAFA;
  --surface:#FFFFFF;
  --surface-2:#F5F4F2;
  --border:rgba(20,20,20,0.09);
  --border-strong:rgba(20,20,20,0.16);
  --text:#1A1A19;
  --text-2:#63625D;
  --text-3:#8B8A85;
  --focus:#1A1A19;

  /* Tiers — open-ended list; add a --tier-N here and a TIERS entry in JS. */
  --tier-1:124,58,196;   /* Analyst Pro */
  --tier-2:15,133,120;   /* Creator */
  --tier-3:196,90,58;    /* Explorer */
  --tier-4:51,110,180;   /* Viewer */

  /* Org-level "neutral" default (no single tier applies), e.g. KPI ring gauges. */
  --accent:100,110,128;
  --tc:var(--accent);

  /* One status scale, reused everywhere: <60 neutral(--tc) / 60-85 amber-tint / 85-95 amber / 95+ red */
  --st-amber-tint:180,120,30;
  --st-amber:181,95,20;
  --st-red:178,48,42;
  --free-fill:rgba(20,20,20,0.045);
  --free-border:rgba(20,20,20,0.18);

  --r-card:12px;
  --r-ctrl:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181817; --canvas:#141413; --surface:#1F1F1E; --surface-2:#242423;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
    --text:#F0EFEC; --text-2:#ABA9A3; --text-3:#7C7A75; --focus:#F0EFEC;
    --tier-1:176,140,235; --tier-2:92,196,182; --tier-3:230,150,120; --tier-4:130,175,230;
    --accent:150,158,172;
    --st-amber-tint:224,176,90; --st-amber:232,150,60; --st-red:235,110,102;
    --free-fill:rgba(255,255,255,0.06); --free-border:rgba(255,255,255,0.22);
  }
}
:root[data-theme="dark"]{
  --bg:#181817; --canvas:#141413; --surface:#1F1F1E; --surface-2:#242423;
  --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
  --text:#F0EFEC; --text-2:#ABA9A3; --text-3:#7C7A75; --focus:#F0EFEC;
  --tier-1:176,140,235; --tier-2:92,196,182; --tier-3:230,150,120; --tier-4:130,175,230;
  --accent:150,158,172;
  --st-amber-tint:224,176,90; --st-amber:232,150,60; --st-red:235,110,102;
  --free-fill:rgba(255,255,255,0.06); --free-border:rgba(255,255,255,0.22);
}

*{box-sizing:border-box;}
html{color-scheme:light dark;}
html[data-theme="light"]{color-scheme:light;}
html[data-theme="dark"]{color-scheme:dark;}
html,body{margin:0;padding:0;}
body{
  background:var(--canvas); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-weight:400; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,select,input{font-family:inherit;}
button{cursor:pointer;}
h1,h2,h3{margin:0; font-weight:500;}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

/* ---------- Status-colored text / fill / stroke (the one scale, everywhere) ---------- */
.st-neutral{ --sc:var(--tc); }
.st-amber-tint{ --sc:var(--st-amber-tint); }
.st-amber{ --sc:var(--st-amber); }
.st-red{ --sc:var(--st-red); }
.status-text{color:rgb(var(--sc));}

/* ============================================================================
   SHELL — persistent, pinned top bar. Identical markup/content on every tab.
   ============================================================================ */
.shell{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:0.5px solid var(--border);}
.shell-inner{max-width:1320px; margin:0 auto; padding:16px 28px 14px;}
.shell-row1{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.org-id{display:flex; flex-direction:column; gap:2px; min-width:0;}
.org-name{font-size:16px; font-weight:500; color:var(--text);}
.org-sub{font-size:12px; color:var(--text-3);}
.shell-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

.search-field{position:relative;}
.search-field i{position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:15px; color:var(--text-3); pointer-events:none;}
.search-field input{
  height:34px; padding:0 10px 0 32px; border:0.5px solid var(--border); border-radius:var(--r-ctrl);
  background:var(--surface); color:var(--text); font-size:13px; width:220px;
}
.search-field input::placeholder{color:var(--text-3);}
.search-field input:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
.shell-search input{width:240px;}

select, input[type="date"]{
  height:34px; border:0.5px solid var(--border); border-radius:var(--r-ctrl); background:var(--surface);
  color:var(--text); font-size:13px; padding:0 10px;
}
select:focus-visible, input[type="date"]:focus-visible{outline:2px solid var(--focus); outline-offset:1px;}
input[type="date"]{width:140px;}

.date-range{display:flex; align-items:center; gap:8px;}

.icon-btn{
  display:flex; align-items:center; justify-content:center; width:34px; height:34px; flex-shrink:0;
  border:0.5px solid var(--border); border-radius:var(--r-ctrl); background:var(--surface); color:var(--text-2);
}
.icon-btn:hover{color:var(--text); border-color:var(--border-strong);}
.icon-btn:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
.icon-btn i{font-size:17px;}

.shell-row2{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
.health-chip{
  display:flex; align-items:center; gap:8px; padding:7px 12px; border:0.5px solid var(--border);
  border-radius:999px; background:var(--surface-2); font-size:12px; color:var(--text-2);
}
.health-chip i{font-size:15px;}
.health-chip .n{font-size:13px; font-weight:500; color:var(--text);}
.health-chip.is-ok i{color:rgb(var(--tier-2));}
.health-chip.is-warn i, .health-chip.is-warn .n{color:rgb(var(--st-amber));}
.health-chip.is-risk i, .health-chip.is-risk .n{color:rgb(var(--st-red));}

/* ============================================================================
   TABS — single page, content swapped below; no drill-down/URL navigation.
   ============================================================================ */
.tabbar{position:sticky; top:93px; z-index:19; background:var(--bg); border-bottom:0.5px solid var(--border);}
.tabbar-inner{max-width:1320px; margin:0 auto; padding:0 28px; display:flex; gap:4px; overflow-x:auto;}
.tab{
  display:flex; align-items:center; gap:7px; padding:12px 4px 11px; margin-right:22px; border:none; background:none;
  color:var(--text-2); font-size:13px; font-weight:400; border-bottom:2px solid transparent; white-space:nowrap;
}
.tab i{font-size:16px;}
.tab:hover{color:var(--text);}
.tab[aria-selected="true"]{color:var(--text); font-weight:500; border-bottom-color:var(--text);}
.tab:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px;}

.page{max-width:1320px; margin:0 auto; padding:28px 28px 80px;}
[role="tabpanel"][hidden]{display:none;}

/* ---------- Card shell (shared) ---------- */
.card{background:var(--surface); border:0.5px solid var(--border); border-radius:var(--r-card); padding:20px;}
.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
.card-title{font-size:13px; font-weight:500; color:var(--text); display:flex; align-items:center; gap:7px;}
.card-title i{font-size:16px; color:var(--text-2);}
.card-sub{font-size:12px; color:var(--text-3); margin-top:2px;}

/* ============================================================================
   TAB 1 — OVERVIEW: responsive KPI card grid, worst-first, no drill-down.
   ============================================================================ */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(272px, 1fr)); gap:16px;}
.kpi-card{background:var(--surface); border:0.5px solid var(--border); border-radius:var(--r-card); padding:18px;}
.kpi-top{display:flex; align-items:center; gap:12px;}
.kpi-name{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:var(--text); flex:1; min-width:0;}
.kpi-name i{font-size:16px; color:var(--text-2); flex-shrink:0;}
.ring-gauge{flex-shrink:0;}
.ring-track{fill:none; stroke:var(--border-strong); stroke-width:5;}
.ring-fill{fill:none; stroke-width:5; stroke-linecap:round; stroke:rgb(var(--sc)); transition:stroke-dasharray .2s ease;}
.ring-label{font-size:12px; font-weight:500; fill:var(--text); font-family:'Inter',sans-serif;}

.kpi-figures{display:flex; align-items:baseline; gap:6px; margin-top:14px;}
.kpi-figures .used{font-size:16px; font-weight:500; color:var(--text);}
.kpi-figures .of{font-size:12px; color:var(--text-3);}
.kpi-figures .total{font-size:13px; color:var(--text-2);}


.kpi-stressed{
  display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; padding-top:12px;
  border-top:0.5px solid var(--border); font-size:12px; color:var(--text-3);
}
.kpi-stressed .tier-pill{flex-shrink:0;}

/* ---------- Per-object usage-over-time charts (Overview tab) ---------- */
.section-label{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:28px 0 14px;}
.section-label h2{font-size:13px; font-weight:500; color:var(--text);}
.section-label .range-note{font-size:12px; color:var(--text-3);}
.chart-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:16px;}
.chart-card{background:var(--surface); border:0.5px solid var(--border); border-radius:var(--r-card); padding:18px;}
.chart-card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
.chart-card-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:var(--text);}
.chart-card-title i{font-size:16px; color:var(--text-2);}
.chart-card-figure{font-size:12px; color:var(--text-3);}
.chart-card-figure .val{font-weight:500;}
.chart-canvas-wrap{position:relative; height:180px;}
.chart-empty{display:flex; align-items:center; justify-content:center; height:180px; font-size:12px; color:var(--text-3);}

/* ---------- Tier pill (shared: overview / allocation / users) ---------- */
.tier-pill{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px;
  background:rgba(var(--tc),0.14); color:rgb(var(--tc)); font-size:11px; font-weight:500; white-space:nowrap;
}
.tier-pill .dot{width:6px; height:6px; border-radius:999px; background:rgb(var(--tc));}

/* ---------- Adhoc pill (shared) ---------- */
.adhoc-pill{
  display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:999px;
  background:rgba(var(--tc),0.14); color:rgb(var(--tc)); font-size:11px; font-weight:500; white-space:nowrap;
}
.adhoc-pill svg{width:10px; height:10px; display:block;}
.adhoc-pill.lowered svg{transform:scaleY(-1);}
.adhoc-dash{color:var(--text-3); font-size:12px;}

/* ============================================================================
   TAB 2 — ALLOCATION: stacked sections, Object|License toggle.
   ============================================================================ */
.alloc-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px;}
.alloc-toolbar-label{font-size:12px; color:var(--text-3);}
.segmented{display:inline-flex; border:0.5px solid var(--border); border-radius:999px; padding:2px; background:var(--surface);}
.segmented button{
  border:none; background:none; padding:6px 14px; border-radius:999px; font-size:12px; color:var(--text-2); font-weight:400;
}
.segmented button[aria-checked="true"]{background:var(--text); color:var(--bg); font-weight:500;}
.segmented button:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

.alloc-sections{display:flex; flex-direction:column; gap:16px;}
.alloc-section{scroll-margin-top:160px;}
.section-head{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.section-head i{font-size:16px; color:var(--text-2);}
.section-head h3{font-size:13px; font-weight:500;}
.section-head .section-sub{font-size:12px; color:var(--text-3); margin-left:auto;}
.section-head .tier-dot{width:9px; height:9px; border-radius:999px; background:rgb(var(--tc)); flex-shrink:0;}

/* Stacked allocation bar (org pool -> tiers -> trailing free segment) */
.stack-bar{display:flex; width:100%; height:34px; border-radius:8px; overflow:hidden; border:0.5px solid var(--border);}
.stack-seg{position:relative; height:100%; border:none; padding:0; flex-shrink:0; background:rgba(var(--tc),0.22); overflow:hidden;}
.stack-seg + .stack-seg{border-left:1px solid var(--bg);}
.stack-seg-fill{position:absolute; inset:0 auto 0 0; background:rgba(var(--sc),0.85);}
.stack-seg:focus-visible{outline:2px solid var(--focus); outline-offset:-2px; z-index:1;}
.seg-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; color:var(--text); white-space:nowrap; pointer-events:none; mix-blend-mode:normal;}
.seg-free{height:100%; background:var(--free-fill); flex-shrink:0; box-shadow:inset 0 0 0 1px var(--free-border);}

.legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.legend-item{
  display:flex; align-items:center; gap:8px; padding:6px 10px; border:0.5px solid var(--border);
  border-radius:999px; background:var(--surface); font-size:12px; color:var(--text-2);
}
.legend-dot{width:8px; height:8px; border-radius:999px; background:rgb(var(--tc)); flex-shrink:0;}
.legend-item.legend-free .legend-dot{background:none; box-shadow:inset 0 0 0 1px var(--free-border);}
.legend-pct{font-weight:500;}

.mini-list{margin-top:16px; padding-top:14px; border-top:0.5px solid var(--border);}
.mini-list-title{font-size:11px; color:var(--text-3); margin-bottom:8px; text-transform:none;}
.mini-row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12px;}
.mini-row .mini-name{flex:1; min-width:0; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mini-row .mini-pct{font-weight:500; width:40px; text-align:right; flex-shrink:0;}
.mini-empty{font-size:12px; color:var(--text-3); padding:4px 0;}

/* Heatmap row (Group by Tier: one tier across all objects) */
.heatmap-row{display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:8px; margin-top:14px;}
.heatmap-cell{
  border-radius:var(--r-ctrl); border:0.5px solid var(--border); padding:10px 12px; background:rgba(var(--sc),0.10);
}
.heatmap-cell .obj-name{font-size:11px; color:var(--text-2); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.heatmap-cell .obj-pct{font-size:15px; font-weight:500; color:rgb(var(--sc)); margin-top:2px; display:block;}

.tier-figures{display:flex; gap:20px; margin-top:2px; flex-wrap:wrap;}
.tier-figures .n{font-size:15px; font-weight:500; color:var(--text);}
.tier-figures .l{font-size:11px; color:var(--text-3); margin-top:2px;}

/* Search-match highlight, applied wherever a user's name renders */
.search-hit{background:rgba(var(--st-amber-tint),0.30); border-radius:3px; padding:0 2px; box-shadow:0 0 0 1px rgba(var(--st-amber-tint),0.4);}

/* ============================================================================
   TAB 3 — USERS: one virtualized, sortable, faceted table. Only place exact
   per-user numbers appear.
   ============================================================================ */
.users-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.facet-toggle{
  display:flex; align-items:center; gap:6px; height:34px; padding:0 12px; border:0.5px solid var(--border);
  border-radius:999px; background:var(--surface); color:var(--text-2); font-size:12px;
}
.facet-toggle i{font-size:14px;}
.facet-toggle[aria-pressed="true"]{background:var(--text); color:var(--bg); border-color:var(--text);}
.facet-toggle:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
.facet-label{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-3);}
.toolbar-spacer{flex:1;}
.toolbar-count{font-size:12px; color:var(--text-3); white-space:nowrap;}

.table-wrap{border:0.5px solid var(--border); border-radius:var(--r-card); overflow:hidden;}
.table-scroll{overflow:auto; max-height:640px; position:relative;}
.t-row{display:grid; align-items:center;}
.t-head{position:sticky; top:0; z-index:2; background:var(--surface-2); border-bottom:0.5px solid var(--border);}
.t-cell{
  padding:0 14px; font-size:12px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  height:44px; display:flex; align-items:center;
}
.t-head .t-cell{
  height:38px; font-size:11px; font-weight:500; color:var(--text-3); background:var(--surface-2);
  border:none; padding:0 14px; gap:4px;
}
.t-head .t-cell button{
  all:unset; display:flex; align-items:center; gap:4px; cursor:pointer; width:100%; height:100%; color:inherit; font:inherit;
}
.t-head .t-cell button:focus-visible{outline:2px solid var(--focus); outline-offset:-2px; border-radius:4px;}
.t-head .t-cell.is-sorted{color:var(--text);}
.t-head .t-cell i{font-size:13px;}
.t-cell.col-user{position:sticky; left:0; z-index:1; background:var(--surface); border-right:0.5px solid var(--border); gap:8px;}
.t-head .col-user{background:var(--surface-2);}
.user-avatar{
  width:22px; height:22px; border-radius:999px; background:var(--surface-2); border:0.5px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:500; color:var(--text-2); flex-shrink:0;
}
.t-cell.col-user .user-name{color:var(--text); font-weight:400; overflow:hidden; text-overflow:ellipsis;}
.t-body{position:relative;}
.t-body .t-row{position:absolute; left:0; right:0; border-bottom:0.5px solid var(--border);}
.t-body .t-row:hover .t-cell{background:var(--surface-2);}
.t-body .t-row:hover .col-user{background:var(--surface-2);}
.cell-metric{display:flex; align-items:baseline; gap:5px;}
.cell-metric .m-val{font-weight:500;}
.cell-metric .m-adhoc{width:9px; height:9px; flex-shrink:0;}
.cell-metric .m-adhoc svg{width:100%; height:100%; display:block;}
.cell-metric .m-adhoc.lowered svg{transform:scaleY(-1);}
.cell-dim{color:var(--text-3);}
.empty-row{padding:40px 14px; text-align:center; font-size:12px; color:var(--text-3);}

/* ---------- Tooltip (shared) ---------- */
#tooltip{
  position:fixed; z-index:100; pointer-events:none; background:var(--text); color:var(--bg);
  font-size:11px; font-weight:500; padding:6px 9px; border-radius:6px; max-width:280px;
  line-height:1.35; opacity:0; transition:opacity .1s ease; transform:translate(-50%,-100%);
}
#tooltip.visible{opacity:1;}
#tooltip::after{content:""; position:absolute; left:50%; bottom:-4px; width:8px; height:8px; margin-left:-4px; background:var(--text); transform:rotate(45deg);}

@media (max-width:760px){
  .page{padding:20px 16px 60px;}
  .shell-inner{padding:14px 16px 12px;}
  .tabbar-inner{padding:0 16px;}
}
</style>
</head>
<body>

<!-- ============================================================================
     PERSISTENT SHELL — identical on every tab. Org identity, org-wide health
     counters, global user search, time range. Nothing here reacts to which
     tab is active.
     ============================================================================ -->
<header class="shell">
  <div class="shell-inner">
    <div class="shell-row1">
      <div class="org-id">
        <span class="org-name">Acme Health Systems</span>
        <span class="org-sub">Usage dashboard</span>
      </div>
      <div class="shell-controls">
        <div class="search-field shell-search">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" id="globalSearch" placeholder="Search users…" aria-label="Search users across the org">
        </div>
        <div class="date-range" role="group" aria-label="Date range">
          <label class="facet-label">From
            <input type="date" id="dateFrom" aria-label="From date">
          </label>
          <label class="facet-label">To
            <input type="date" id="dateTo" aria-label="To date">
          </label>
        </div>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle dark mode">
          <i class="ti ti-moon" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    <div class="shell-row2" id="healthCounters" aria-label="Org health summary"></div>
  </div>
</header>

<!-- ============================================================================
     TAB CONTROL — one page, three panels swapped below. No drill-down/URL
     routing: selecting a tab only toggles which <section> is visible.
     ============================================================================ -->
<nav class="tabbar" role="tablist" aria-label="Usage dashboard sections">
  <div class="tabbar-inner">

          <option value="raw">Used / cap</option>

<div id="tooltip" role="tooltip"></div>

<script>
/* ============================================================================
   SECTION: DATA MODEL
   Shaped the way a real API would return it, across three unbounded axes:
     OBJECTS  — open-ended usage KPIs, each with an org POOL. Adding one more
                is a single entry in this array; nothing else changes shape.
     TIERS    — open-ended license tiers. Each OBJECT allocates part of its
                pool to each tier (sum may be < pool; remainder is free).
     USERS    — assigned to exactly one tier. Default per-object cap is an
                even split of that tier's allocation; ADHOC records override
                one user's cap on one object (only on adhoc-eligible objects).
   Everything downstream (aggregates, selectors, render) is derived from
   these four consts — this whole block is what a React port swaps for a
   fetch() / query hook.
   ============================================================================ */
const TIERS = [
  { id:'analyst_pro', name:'Analyst Pro', color:'tier-1', seatCap:22 },
  { id:'creator',      name:'Creator',     color:'tier-2', seatCap:20 },
  { id:'explorer',     name:'Explorer',    color:'tier-3', seatCap:14 },
  { id:'viewer',       name:'Viewer',      color:'tier-4', seatCap:10 },
];

const OBJECTS = [
  { id:'dashboards',  name:'Dashboards',  icon:'layout-dashboard', pool:400,    adhocAllowed:false,
    allocations:{ analyst_pro:180, creator:140, explorer:50, viewer:20 } },
  { id:'storyboards', name:'Storyboards', icon:'presentation-analytics', pool:500, adhocAllowed:false,
    allocations:{ analyst_pro:220, creator:170, explorer:70, viewer:30 } },
  { id:'datasets',    name:'Datasets',    icon:'database',   pool:1000,   adhocAllowed:true,
    allocations:{ analyst_pro:450, creator:320, explorer:150, viewer:60 } },
  { id:'sharing',     name:'Sharing',     icon:'share-2',    pool:5000,   adhocAllowed:false,
    allocations:{ analyst_pro:2200, creator:1700, explorer:800, viewer:250 } },
  { id:'queries',     name:'Queries',     icon:'terminal-2', pool:100000, adhocAllowed:true,
    allocations:{ analyst_pro:48000, creator:32000, explorer:14000, viewer:4000 } },
  { id:'ai_credits',  name:'AI credits',  icon:'sparkles',   pool:200000, adhocAllowed:true,
    allocations:{ analyst_pro:100000, creator:65000, explorer:25000, viewer:8000 } },
  // Add another usage KPI by appending one entry here — no layout change needed.
];

const ROSTER = {
  analyst_pro: ['Priya Nair','Marcus Webb','Elena Petrova','Sofia Alvarez','Daniel Kim','Rachel Osei','Hassan Ali','Wei Zhang','Isabella Rossi','Noah Bergström','Fatima Haidari','Lucas Dubois','Aiko Tanaka','Samuel Adeyemi','Clara Novak','Omar Farouk','Ingrid Larsen','Tariq Malik'],
  creator: ['Jordan Lee','Amara Okafor','Tom Richter','Grace Chen','Diego Fernández','Chloe Martin','Ravi Shankar','Nadia Petrov','Ethan Brooks','Yuki Sato','Leila Haddad','Connor Murphy','Mia Johansson','Ben Okoye','Sara Lindqvist','Arjun Mehta'],
  explorer: ["Liam O'Connor",'Nina Osei','Victor Hugo Santos','Mei Ling Tan','Oscar Berg','Ana Cristina Silva','Jonas Weber','Priyanka Rao','Felix Ngata','Hannah Kessler'],
  viewer: ['Zoe Papadopoulos','Karim Benali','Emma Sundström','Jamal Carter','Lucia Moreno','Simon Vogt','Aisha Rahman','Peter Novotny'],
};
const slug = name => name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const USERS = [];
TIERS.forEach(t => (ROSTER[t.id] || []).forEach(name => USERS.push({ id: slug(name), name, tierId: t.id })));

// Adhoc overrides: an admin picks one user + one adhoc-eligible object and
// replaces the default even share (cap:null everywhere else means "default").
// 3 raised, 3 lowered, spread across the three adhoc-eligible objects.
const ADHOC = {
  'marcus-webb':   { datasets: 55 },     // raised
  'chloe-martin':  { datasets: 6 },      // lowered
  'elena-petrova': { queries: 5200 },    // raised
  'karim-benali':  { queries: 150 },     // lowered
  'ravi-shankar':  { ai_credits: 9000 }, // raised
  'oscar-berg':    { ai_credits: 600 },  // lowered
};
// Hand-set "used" for adhoc cells so the mock tells a clear story (a mix of
// stressed and comfortable overrides); every other cell is generated below.
const ADHOC_USED = {
  'marcus-webb:datasets': 51, 'chloe-martin:datasets': 5,
  'elena-petrova:queries': 5100, 'karim-benali:queries': 40,
  'ravi-shankar:ai_credits': 8700, 'oscar-berg:ai_credits': 200,
};
// Per-object usage pressure — some KPIs just run hotter org-wide (sharing
// and AI credits are commonly the first to get constrained in practice).
const PRESSURE = { dashboards:0.7, storyboards:0.6, datasets:0.95, sharing:1.25, queries:0.75, ai_credits:1.05 };

/* ---------- Deterministic mock-data RNG (no server, so seed instead of Math.random) ---------- */
function hashSeed(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rngFor = (...parts) => mulberry32(hashSeed(parts.join('|')));
function usageFactor(rand){
  const r = rand();
  if (r < 0.05) return 0.95 + rand() * 0.40; // near/over cap
  if (r < 0.28) return 0.55 + rand() * 0.27; // mid, kept clear of the 85% line
  return 0.05 + rand() * 0.50;               // comfortable
}

/* ---------- USAGE: usage[userId][objectId] = { used, cap, share, isAdhoc } ---------- */
function computeUsage(){
  const usage = {};
  USERS.forEach(u => { usage[u.id] = {}; });
  OBJECTS.forEach(obj => {
    const pressure = PRESSURE[obj.id] || 1;
    TIERS.forEach(tier => {
      const alloc = obj.allocations[tier.id] || 0;
      const members = USERS.filter(u => u.tierId === tier.id);
      const share = members.length ? alloc / members.length : 0;
      members.forEach(u => {
        const override = ADHOC[u.id] && ADHOC[u.id][obj.id];
        const isAdhoc = override != null;
        const cap = isAdhoc ? override : share;
        const key = u.id + ':' + obj.id;
        let used;
        if (ADHOC_USED[key] != null){
          used = ADHOC_USED[key];
        } else {
          const factor = usageFactor(rngFor(u.id, obj.id));
          used = Math.max(0, Math.round(share * factor * pressure));
          used = Math.min(used, Math.round(cap * 1.6));
        }
        usage[u.id][obj.id] = { used, cap, share, isAdhoc };
      });
    });
  });
  return usage;
}
const USAGE = computeUsage();

/* ============================================================================
   SECTION: SELECTORS / AGGREGATES — pure functions over the data model above.
   ============================================================================ */
const findObj = id => OBJECTS.find(o => o.id === id);
const findTier = id => TIERS.find(t => t.id === id);
const cell = (userId, objId) => USAGE[userId][objId];
const cellPct = c => c.cap ? Math.min(999, c.used / c.cap * 100) : 0;
const tierMembers = tierId => USERS.filter(u => u.tierId === tierId);

function tierUsed(objId, tierId){ return tierMembers(tierId).reduce((s, u) => s + cell(u.id, objId).used, 0); }
function tierCommitted(objId, tierId){ return tierMembers(tierId).reduce((s, u) => s + cell(u.id, objId).cap, 0); }
function orgAllocated(obj){ return TIERS.reduce((s, t) => s + (obj.allocations[t.id] || 0), 0); }
function orgFree(obj){ return Math.max(0, obj.pool - orgAllocated(obj)); }
function orgUsed(obj){ return TIERS.reduce((s, t) => s + tierUsed(obj.id, t.id), 0); }
function orgPct(obj){ return obj.pool ? orgUsed(obj) / obj.pool * 100 : 0; }
function mostStressedTier(obj){
  let best = null;
  TIERS.forEach(t => {
    const alloc = obj.allocations[t.id] || 0;
    if (!alloc) return;
    const p = tierUsed(obj.id, t.id) / alloc * 100;
    if (!best || p > best.pct) best = { tier: t, pct: p };
  });
  return best;
}
function adhocGrantCount(tierId){
  let n = 0;
  tierMembers(tierId).forEach(u => { const a = ADHOC[u.id]; if (a) n += Object.keys(a).length; });
  return n;
}
function topStressedUsers(objId, n){
  return USERS.map(u => { const c = cell(u.id, objId); return { user: u, c, pct: cellPct(c) }; })
    .sort((a, b) => b.pct - a.pct).slice(0, n);
}

/* ---------- Daily usage series per object (Overview "usage over time" charts).
   A real API would return this directly (date, used) instead of a seeded walk;
   it's anchored so the most recent day matches the actual current usage. ---------- */
const HISTORY_DAYS = 180;
// Local calendar date, not toISOString() (which converts to UTC and rolls
// the date back a day in any timezone ahead of UTC, e.g. IST).
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const EARLIEST_DATE = new Date(TODAY); EARLIEST_DATE.setDate(EARLIEST_DATE.getDate() - (HISTORY_DAYS - 1));
function buildSeries(obj){
  const endPct = orgPct(obj);
  const r = mulberry32(hashSeed('series|' + obj.id));
  let v = Math.max(1, Math.min(99, endPct - (r() * 20 - 10)));
  const out = [];
  for (let i = HISTORY_DAYS - 1; i >= 0; i--){
    const d = new Date(TODAY); d.setDate(d.getDate() - i);
    v += r() * 6 - 3;
    v = Math.max(1, Math.min(99, v));
    const p = i === 0 ? endPct : v;
    out.push({ date: isoDate(d), pct: p, used: obj.pool * p / 100 });
  }
  return out;
}
OBJECTS.forEach(obj => { obj.series = buildSeries(obj); });
function seriesInRange(obj, from, to){ return obj.series.filter(pt => pt.date >= from && pt.date <= to); }

// <60 neutral(--tc) · 60-85 amber-tint · 85-95 amber · 95+ red — the one scale, everywhere.
function statusClass(p){
  if (p >= 95) return 'st-red';
  if (p >= 85) return 'st-amber';
  if (p >= 60) return 'st-amber-tint';
  return 'st-neutral';
}
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = n => Math.round(n);
const initials = name => name.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();

/* ---------- Org-wide health counters (time-range independent, as the shell is pinned) ---------- */
function poolsAtRisk(){ return OBJECTS.filter(o => orgPct(o) >= 85).length; }
function usersNearCap(){ return USERS.filter(u => OBJECTS.some(o => cellPct(cell(u.id, o.id)) >= 85)).length; }
function licensesFree(){ return TIERS.reduce((s, t) => s + Math.max(0, t.seatCap - tierMembers(t.id).length), 0); }

/* ============================================================================
   SECTION: STATE
   ============================================================================ */
const DEFAULT_FROM = new Date(TODAY); DEFAULT_FROM.setDate(DEFAULT_FROM.getDate() - 29);
const state = {
  tab: 'overview',
  dateFrom: isoDate(DEFAULT_FROM),
  dateTo: isoDate(TODAY),
  searchQuery: '',
  allocGroupBy: 'object',
  usersFacetTier: '',
  usersFacetOver85: false,
  usersFacetAdhoc: false,
  usersValueMode: 'raw',
  usersSort: { key: 'name', dir: 'asc' },
  scrollTop: 0,
};
const ROW_H = 44;
const OVERSCAN = 6;

/* ============================================================================
   SECTION: SHARED UI HELPERS (tooltip, search-match highlighting)
   ============================================================================ */
const tooltipEl = document.getElementById('tooltip');
function bindTooltip(el, text){
  el.setAttribute('data-tooltip', text);
  el.addEventListener('mouseenter', showTooltip);
  el.addEventListener('mousemove', showTooltip);
  el.addEventListener('mouseleave', hideTooltip);
  el.addEventListener('focus', showTooltip);
  el.addEventListener('blur', hideTooltip);
}
function showTooltip(e){
  const el = e.currentTarget; const text = el.getAttribute('data-tooltip'); if (!text) return;
  tooltipEl.textContent = text;
  const r = el.getBoundingClientRect();
  tooltipEl.style.left = Math.min(window.innerWidth - 10, Math.max(10, r.left + r.width / 2)) + 'px';
  tooltipEl.style.top = (r.top - 8) + 'px';
  tooltipEl.classList.add('visible');
}
function hideTooltip(){ tooltipEl.classList.remove('visible'); }

function nameHTML(name){
  const q = state.searchQuery.trim().toLowerCase();
  const hit = q && name.toLowerCase().includes(q);
  return hit ? `<span class="search-hit">${name}</span>` : name;
}

function capDetail(c){
  if (!c.isAdhoc) return `default even share (${fmt(c.share)})`;
  const delta = c.cap - c.share;
  return `default share ${fmt(c.share)}, ${delta >= 0 ? 'raised' : 'lowered'} by ${fmt(Math.abs(delta))}`;
}
function adhocIcon(lowered){
  return `<svg class="m-adhoc${lowered ? ' lowered' : ''}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <line x1="8" y1="13" x2="8" y2="3"/><polyline points="4,6 8,3 12,6"/></svg>`;
}

/* ============================================================================
   SECTION: SHELL — health counters (rendered once; independent of tab/state
   except the mock data itself).
   ============================================================================ */
function renderHealthCounters(){
  const atRisk = poolsAtRisk(), nearCap = usersNearCap(), free = licensesFree();
  const wrap = document.getElementById('healthCounters');
  wrap.innerHTML = `
    <span class="health-chip ${atRisk > 0 ? 'is-risk' : 'is-ok'}"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span class="n">${atRisk}</span> pool${atRisk === 1 ? '' : 's'} at risk</span>
    <span class="health-chip ${nearCap > 0 ? 'is-warn' : 'is-ok'}"><i class="ti ti-gauge" aria-hidden="true"></i><span class="n">${nearCap}</span> user${nearCap === 1 ? '' : 's'} near cap</span>
    <span class="health-chip is-ok"><i class="ti ti-id-badge-2" aria-hidden="true"></i><span class="n">${free}</span> license${free === 1 ? '' : 's'} free</span>
  `;
}

/* ============================================================================
   SECTION: TAB SWITCHING
   ============================================================================ */
function selectTab(tab, { focus = false } = {}){
  state.tab = tab;
  ['overview', 'allocation', 'users'].forEach(t => {
    const btn = document.getElementById('tab-' + t);
    const panel = document.getElementById('panel-' + t);
    const active = t === tab;
    btn.setAttribute('aria-selected', active);
    btn.tabIndex = active ? 0 : -1;
    panel.hidden = !active;
    if (active && focus) btn.focus();
  });
  // Re-measure: a table/chart built while its panel was display:none has
  // stale viewport dimensions until the panel is actually shown.
  if (tab === 'users') renderUsersRows();
  if (tab === 'overview') Object.values(charts).forEach(c => c.resize());
}
document.querySelectorAll('.tab').forEach((btn, i, all) => {
  btn.addEventListener('click', () => selectTab(btn.dataset.tab));
  btn.addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    let idx = i;
    if (e.key === 'ArrowLeft') idx = (i - 1 + all.length) % all.length;
    if (e.key === 'ArrowRight') idx = (i + 1) % all.length;
    if (e.key === 'Home') idx = 0;
    if (e.key === 'End') idx = all.length - 1;
    selectTab(all[idx].dataset.tab, { focus: true });
  });
});

/* ============================================================================
   SECTION: TAB 1 — OVERVIEW (KPI cards, worst-first, no drill-down)
   ============================================================================ */
function ringGauge(p, statusCls){
  const r = 20, c = 2 * Math.PI * r;
  const dash = Math.max(0, Math.min(100, p)) / 100 * c;
  return `<svg class="ring-gauge" viewBox="0 0 48 48" width="48" height="48" role="img" aria-hidden="true">
    <circle cx="24" cy="24" r="${r}" class="ring-track"/>
    <circle cx="24" cy="24" r="${r}" class="ring-fill ${statusCls}" stroke-dasharray="${dash} ${c}" transform="rotate(-90 24 24)"/>
    <text x="24" y="28" text-anchor="middle" class="ring-label">${pct(p)}%</text>
  </svg>`;
}
function renderOverview(){
  const cards = OBJECTS.map(obj => ({ obj, p: orgPct(obj) })).sort((a, b) => b.p - a.p);
  document.getElementById('kpiGrid').innerHTML = cards.map(({ obj, p }) => {
    const st = statusClass(p);
    const stressed = mostStressedTier(obj);
    return `
      <article class="kpi-card">
        <div class="kpi-top">
          <div class="kpi-name"><i class="ti ti-${obj.icon}" aria-hidden="true"></i>${obj.name}</div>
          ${ringGauge(p, st)}
        </div>
        <div class="kpi-figures">
          <span class="used status-text ${st}">${fmt(orgUsed(obj))}</span>
          <span class="of">of</span><span class="total">${fmt(obj.pool)}</span>
        </div>
        <div class="kpi-stressed">
          <span>Most stressed license</span>
          ${stressed ? `<span class="tier-pill" style="--tc:var(--${stressed.tier.color})"><span class="dot"></span>${stressed.tier.name} · ${pct(stressed.pct)}%</span>` : '<span>—</span>'}
        </div>
      </article>`;
  }).join('');
}

/* ---------- Per-object "usage over time" charts, driven by the shell's
   From/To date range. Chart.js reads real color values (not CSS var()
   strings), so colors are resolved from the current theme at render/theme-
   toggle time via cssVar()/rgbVar(). One Chart instance per object, reused
   across re-renders via .update() rather than destroyed/recreated. ---------- */
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function rgbVar(name){ return `rgb(${cssVar(name)})`; }
function rgbaVar(name, alpha){ return `rgba(${cssVar(name)},${alpha})`; }
function statusColorVarName(st){
  if (st === 'st-red') return '--st-red';
  if (st === 'st-amber') return '--st-amber';
  if (st === 'st-amber-tint') return '--st-amber-tint';
  return '--accent';
}
function formatShortDate(iso){
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

const charts = {};
function renderCharts(){
  document.getElementById('chartRangeNote').textContent =
    `${formatShortDate(state.dateFrom)} – ${formatShortDate(state.dateTo)}`;
  const wrap = document.getElementById('chartGrid');
  const textColor = cssVar('--text-3');
  const gridColor = cssVar('--border');

  OBJECTS.forEach(obj => {
    let card = document.getElementById('chart-card-' + obj.id);
    if (!card){
      card = document.createElement('article');
      card.className = 'chart-card';
      card.id = 'chart-card-' + obj.id;
      wrap.appendChild(card);
    }
    const points = seriesInRange(obj, state.dateFrom, state.dateTo);
    const st = statusClass(orgPct(obj));
    const color = rgbVar(statusColorVarName(st));

    card.innerHTML = `
      <div class="chart-card-head">
        <div class="chart-card-title"><i class="ti ti-${obj.icon}" aria-hidden="true"></i>${obj.name}</div>
        <span class="chart-card-figure"><span class="val">${fmt(orgUsed(obj))}</span> / ${fmt(obj.pool)}</span>
      </div>
      <div class="chart-canvas-wrap">${points.length ? `<canvas id="chart-canvas-${obj.id}"></canvas>` : '<div class="chart-empty">No data in this range.</div>'}</div>`;

    if (!points.length){
      if (charts[obj.id]){ charts[obj.id].destroy(); delete charts[obj.id]; }
      return;
    }

    const labels = points.map(p => formatShortDate(p.date));
    const data = points.map(p => p.pct);
    const rawUsed = points.map(p => p.used);

    // The card's canvas was just rebuilt via innerHTML above, so any prior
    // Chart instance is bound to a detached canvas — always recreate.
    if (charts[obj.id]) charts[obj.id].destroy();
    const ctx = document.getElementById('chart-canvas-' + obj.id).getContext('2d');
    charts[obj.id] = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: [{
        data, rawUsed, borderColor: color, backgroundColor: rgbaVar(statusColorVarName(st), 0.12),
        fill: true, tension: 0.3, pointRadius: 0, borderWidth: 1.5, borderCapStyle: 'round',
      }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { intersect: false, mode: 'index' },
        scales: {
          x: { grid: { display: false }, ticks: { color: textColor, maxTicksLimit: 6, font: { size: 10, family: 'Inter' } } },
          y: { min: 0, suggestedMax: 100, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10, family: 'Inter' }, callback: v => v + '%' } },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: cssVar('--text'), titleColor: cssVar('--bg'), bodyColor: cssVar('--bg'),
            padding: 8, cornerRadius: 6, displayColors: false,
            callbacks: { label: c => `${Math.round(c.parsed.y)}% · ${fmt(c.dataset.rawUsed[c.dataIndex])} used` },
          },
        },
      },
    });
  });
}

/* ============================================================================
   SECTION: TAB 2 — ALLOCATION (stacked sections; Object|License grouping)
   ============================================================================ */
function renderAllocation(){
  document.querySelectorAll('#panel-allocation .segmented button').forEach(b => {
    b.setAttribute('aria-checked', b.dataset.group === state.allocGroupBy);
  });
  const wrap = document.getElementById('allocSections');

  if (state.allocGroupBy === 'object'){
    wrap.innerHTML = OBJECTS.map(renderAllocObjectSection).join('');
  } else {
    wrap.innerHTML = TIERS.map(renderAllocTierSection).join('');
  }

  // Tooltips + top-stressed mini-list rows need JS-bound detail text.
  wrap.querySelectorAll('[data-tooltip-src]').forEach(el => bindTooltip(el, el.getAttribute('data-tooltip-src')));
}

function renderAllocObjectSection(obj){
  const pool = obj.pool, allocated = orgAllocated(obj), free = orgFree(obj), used = orgUsed(obj);
  const bar = TIERS.filter(t => obj.allocations[t.id]).map(t => {
    const alloc = obj.allocations[t.id];
    const segUsed = tierUsed(obj.id, t.id);
    const segPct = alloc ? Math.min(999, segUsed / alloc * 100) : 0;
    const widthPct = pool ? alloc / pool * 100 : 0;
    const st = statusClass(segPct);
    return `<button type="button" class="stack-seg" style="width:${widthPct}%; --tc:var(--${t.color})"
        data-tooltip-src="${t.name}: ${fmt(alloc)} allocated · ${fmt(segUsed)} used (${pct(segPct)}%)">
      <span class="stack-seg-fill ${st}" style="width:${Math.min(100, segPct)}%"></span>
      ${widthPct > 9 ? `<span class="seg-label">${t.name}</span>` : ''}
    </button>`;
  }).join('');
  const freeSeg = free > 0 ? `<div class="seg-free" style="width:${pool ? free / pool * 100 : 0}%" data-tooltip-src="Free / unallocated: ${fmt(free)}"></div>` : '';

  const legend = TIERS.filter(t => obj.allocations[t.id]).map(t => {
    const alloc = obj.allocations[t.id];
    const segPct = alloc ? Math.min(999, tierUsed(obj.id, t.id) / alloc * 100) : 0;
    return `<span class="legend-item" style="--tc:var(--${t.color})"><span class="legend-dot"></span>${t.name} · ${fmt(alloc)} <span class="legend-pct status-text ${statusClass(segPct)}">${pct(segPct)}%</span></span>`;
  }).join('') + (free > 0 ? `<span class="legend-item legend-free"><span class="legend-dot"></span>Free · ${fmt(free)}</span>` : '');

  const top = topStressedUsers(obj.id, 5);
  const miniRows = top.length ? top.map(({ user, c, pct: p }) => `
    <div class="mini-row">
      <span class="tier-pill" style="--tc:var(--${findTier(user.tierId).color})"><span class="dot"></span>${findTier(user.tierId).name}</span>
      <span class="mini-name">${nameHTML(user.name)}</span>
      ${c.isAdhoc ? `<span class="adhoc-pill ${c.cap < c.share ? 'lowered' : ''}" style="--tc:var(--${findTier(user.tierId).color})">${adhocIcon(c.cap < c.share)}Adhoc</span>` : ''}
      <span class="mini-pct status-text ${statusClass(p)}">${pct(p)}%</span>
    </div>`).join('') : `<div class="mini-empty">No usage recorded yet.</div>`;

  return `
    <section class="alloc-section card" id="sec-obj-${obj.id}">
      <div class="section-head">
        <i class="ti ti-${obj.icon}" aria-hidden="true"></i><h3>${obj.name}</h3>
        <span class="section-sub status-text ${statusClass(orgPct(obj))}">${fmt(used)} / ${fmt(pool)} used · ${pct(orgPct(obj))}%</span>
      </div>
      <div class="stack-bar" role="group" aria-label="${obj.name} allocation by license">${bar}${freeSeg}</div>
      <div class="legend">${legend}</div>
      <div class="mini-list">
        <div class="mini-list-title">Most-stressed users · ${obj.name}</div>
        ${miniRows}
      </div>
    </section>`;
}

function renderAllocTierSection(tier){
  const members = tierMembers(tier.id);
  const free = Math.max(0, tier.seatCap - members.length);
  const grants = adhocGrantCount(tier.id);
  const heat = OBJECTS.map(obj => {
    const alloc = obj.allocations[tier.id] || 0;
    const p = alloc ? Math.min(999, tierUsed(obj.id, tier.id) / alloc * 100) : 0;
    const st = statusClass(p);
    return `<div class="heatmap-cell ${st}" style="--tc:var(--${tier.color})" data-tooltip-src="${obj.name}: ${fmt(tierUsed(obj.id, tier.id))} / ${fmt(alloc)} used (${pct(p)}%)">
      <span class="obj-name">${obj.name}</span><span class="obj-pct status-text ${st}">${pct(p)}%</span>
    </div>`;
  }).join('');

  return `
    <section class="alloc-section card" id="sec-tier-${tier.id}">
      <div class="section-head">
        <span class="tier-dot" style="--tc:var(--${tier.color})"></span><h3>${tier.name}</h3>
      </div>
      <div class="tier-figures">
        <div><div class="n">${members.length} / ${tier.seatCap}</div><div class="l">Seats assigned / cap</div></div>
        <div><div class="n">${free}</div><div class="l">Seats free</div></div>
        <div><div class="n">${grants}</div><div class="l">Adhoc grants</div></div>
      </div>
      <div class="heatmap-row">${heat}</div>
    </section>`;
}

document.querySelectorAll('#panel-allocation .segmented button').forEach(btn => {
  btn.addEventListener('click', () => { state.allocGroupBy = btn.dataset.group; renderAllocation(); });
});

/* ============================================================================
   SECTION: TAB 3 — USERS (single virtualized, sortable, faceted table)
   ============================================================================ */
const USER_COLUMNS = [
  { key: 'name', label: 'User', width: 190, sortable: true, sticky: true },
  { key: 'tier', label: 'License', width: 130, sortable: true },
  ...OBJECTS.map(o => ({ key: 'obj:' + o.id, label: o.name, width: 128, sortable: true, objId: o.id })),
  { key: 'adhoc', label: 'Adhoc', width: 90, sortable: true },
];
const GRID_TEMPLATE = USER_COLUMNS.map(c => c.width + 'px').join(' ');

function populateTierFacet(){
  const sel = document.getElementById('facetTier');
  sel.innerHTML = '<option value="">All licenses</option>' + TIERS.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
}

function userAdhocCount(u){ return ADHOC[u.id] ? Object.keys(ADHOC[u.id]).length : 0; }
function userMaxPct(u){ return OBJECTS.reduce((m, o) => Math.max(m, cellPct(cell(u.id, o.id))), 0); }

function getFilteredSortedUsers(){
  const q = state.searchQuery.trim().toLowerCase();
  let rows = USERS.filter(u => {
    if (state.usersFacetTier && u.tierId !== state.usersFacetTier) return false;
    if (state.usersFacetOver85 && userMaxPct(u) < 85) return false;
    if (state.usersFacetAdhoc && userAdhocCount(u) === 0) return false;
    if (q && !u.name.toLowerCase().includes(q)) return false;
    return true;
  });
  const { key, dir } = state.usersSort;
  const mul = dir === 'asc' ? 1 : -1;
  rows = rows.slice().sort((a, b) => {
    let av, bv;
    if (key === 'name'){ av = a.name; bv = b.name; return av.localeCompare(bv) * mul; }
    if (key === 'tier'){ av = findTier(a.tierId).name; bv = findTier(b.tierId).name; return av.localeCompare(bv) * mul; }
    if (key === 'adhoc'){ av = userAdhocCount(a); bv = userAdhocCount(b); return (av - bv) * mul; }
    if (key.startsWith('obj:')){
      const objId = key.slice(4);
      av = cellPct(cell(a.id, objId)); bv = cellPct(cell(b.id, objId));
      return (av - bv) * mul;
    }
    return 0;
  });
  return rows;
}

function renderTableHead(){
  const head = document.getElementById('tableHead');
  head.style.gridTemplateColumns = GRID_TEMPLATE;
  head.innerHTML = USER_COLUMNS.map(col => {
    const sorted = state.usersSort.key === col.key;
    const icon = sorted ? (state.usersSort.dir === 'asc' ? 'ti-chevron-up' : 'ti-chevron-down') : '';
    return `<div class="t-cell${col.sticky ? ' col-user' : ''}${sorted ? ' is-sorted' : ''}" role="columnheader">
      <button type="button" data-sort="${col.key}">${col.label}${icon ? `<i class="ti ${icon}" aria-hidden="true"></i>` : ''}</button>
    </div>`;
  }).join('');
  head.querySelectorAll('button[data-sort]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.sort;
      if (state.usersSort.key === key) state.usersSort.dir = state.usersSort.dir === 'asc' ? 'desc' : 'asc';
      else state.usersSort = { key, dir: 'asc' };
      renderTableHead();
      renderUsersRows();
    });
  });
}

function renderUserCellValue(u, col){
  if (col.key === 'name'){
    return `<div class="col-user t-cell" role="cell"><span class="user-avatar" aria-hidden="true">${initials(u.name)}</span><span class="user-name">${nameHTML(u.name)}</span></div>`;
  }
  if (col.key === 'tier'){
    const t = findTier(u.tierId);
    return `<div class="t-cell" role="cell"><span class="tier-pill" style="--tc:var(--${t.color})"><span class="dot"></span>${t.name}</span></div>`;
  }
  if (col.key === 'adhoc'){
    const n = userAdhocCount(u);
    return `<div class="t-cell" role="cell">${n ? `<span class="adhoc-pill" style="--tc:var(--${findTier(u.tierId).color})">${adhocIcon(false)}Adhoc ×${n}</span>` : '<span class="adhoc-dash">—</span>'}</div>`;
  }
  const objId = col.objId;
  const c = cell(u.id, objId);
  const p = cellPct(c);
  const st = statusClass(p);
  const valText = state.usersValueMode === 'pct' ? `${pct(p)}%` : `${fmt(c.used)}<span class="cell-dim">/${fmt(c.cap)}</span>`;
  const tip = `${findObj(objId).name}: ${fmt(c.used)} used of ${fmt(c.cap)} cap (${pct(p)}%) — ${capDetail(c)}`;
  return `<div class="t-cell" role="cell" data-tooltip-src="${tip}"><span class="cell-metric status-text ${st}"><span class="m-val">${valText}</span>${c.isAdhoc ? adhocIcon(c.cap < c.share) : ''}</span></div>`;
}

let allUsersFiltered = [];
function renderUsersTable(){
  allUsersFiltered = getFilteredSortedUsers();
  document.getElementById('usersCount').textContent = `${allUsersFiltered.length} of ${USERS.length} users`;
  const body = document.getElementById('tableBody');
  body.style.height = (allUsersFiltered.length * ROW_H) + 'px';
  renderUsersRows();
}

// Windowed virtualization: only the rows in the current scroll viewport (+
// overscan) are ever in the DOM, regardless of whether there are 50 users
// or 50,000 — the technique, not the row count, is what has to scale.
function renderUsersRows(){
  const scrollEl = document.getElementById('tableScroll');
  const body = document.getElementById('tableBody');
  const rows = allUsersFiltered;

  if (!rows.length){
    body.style.height = '0px';
    body.innerHTML = `<div class="empty-row">No users match the current filters.</div>`;
    return;
  }

  const viewportH = scrollEl.clientHeight || 640;
  const scrollTop = scrollEl.scrollTop;
  const start = Math.max(0, Math.floor(scrollTop / ROW_H) - OVERSCAN);
  const visibleCount = Math.ceil(viewportH / ROW_H) + OVERSCAN * 2;
  const end = Math.min(rows.length, start + visibleCount);

  let html = '';
  for (let i = start; i < end; i++){
    const u = rows[i];
    html += `<div class="t-row" role="row" style="top:${i * ROW_H}px; height:${ROW_H}px; grid-template-columns:${GRID_TEMPLATE}">`;
    html += USER_COLUMNS.map(col => renderUserCellValue(u, col)).join('');
    html += `</div>`;
  }
  body.innerHTML = html;
  body.querySelectorAll('[data-tooltip-src]').forEach(el => bindTooltip(el, el.getAttribute('data-tooltip-src')));
}

let scrollRaf = null;
document.getElementById('tableScroll').addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => { renderUsersRows(); scrollRaf = null; });
});
window.addEventListener('resize', () => renderUsersRows());

document.getElementById('usersSearch').addEventListener('input', e => setSearchQuery(e.target.value, 'usersSearch'));
document.getElementById('globalSearch').addEventListener('input', e => setSearchQuery(e.target.value, 'globalSearch'));
function setSearchQuery(val, sourceId){
  state.searchQuery = val;
  ['usersSearch', 'globalSearch'].forEach(id => { if (id !== sourceId) document.getElementById(id).value = val; });
  renderUsersTable();
  if (state.tab === 'allocation') renderAllocation();
}
document.getElementById('facetTier').addEventListener('change', e => { state.usersFacetTier = e.target.value; renderUsersTable(); });
document.getElementById('facetOver85').addEventListener('click', e => {
  state.usersFacetOver85 = !state.usersFacetOver85;
  e.currentTarget.setAttribute('aria-pressed', state.usersFacetOver85);
  renderUsersTable();
});
document.getElementById('facetAdhoc').addEventListener('click', e => {
  state.usersFacetAdhoc = !state.usersFacetAdhoc;
  e.currentTarget.setAttribute('aria-pressed', state.usersFacetAdhoc);
  renderUsersTable();
});
document.getElementById('valueMode').addEventListener('change', e => { state.usersValueMode = e.target.value; renderUsersRows(); });

/* ============================================================================
   SECTION: DATE RANGE + THEME TOGGLE (shell controls)
   ============================================================================ */
const dateFromEl = document.getElementById('dateFrom');
const dateToEl = document.getElementById('dateTo');
function initDateInputs(){
  const min = isoDate(EARLIEST_DATE), max = isoDate(TODAY);
  [dateFromEl, dateToEl].forEach(el => { el.min = min; el.max = max; });
  dateFromEl.value = state.dateFrom;
  dateToEl.value = state.dateTo;
}
function onDateRangeChange(){
  let from = dateFromEl.value, to = dateToEl.value;
  if (from > to){ [from, to] = [to, from]; } // keep the range valid regardless of which field changed
  state.dateFrom = from; state.dateTo = to;
  dateFromEl.value = from; dateToEl.value = to;
  renderCharts();
}
dateFromEl.addEventListener('change', onDateRangeChange);
dateToEl.addEventListener('change', onDateRangeChange);

const themeToggle = document.getElementById('themeToggle');
function applyThemeIcon(){
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current === 'dark' || (!current && matchMedia('(prefers-color-scheme: dark)').matches);
  themeToggle.querySelector('i').className = isDark ? 'ti ti-sun' : 'ti ti-moon';
}
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current === 'dark' || (!current && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  applyThemeIcon();
  renderCharts(); // Chart.js reads resolved colors, not CSS vars — repaint on theme change.
});
applyThemeIcon();

/* ============================================================================
   SECTION: INIT
   ============================================================================ */
renderHealthCounters();
renderOverview();
initDateInputs();
renderCharts();
populateTierFacet();
renderTableHead();
renderUsersTable();
renderAllocation();
</script>
</body>
</html>
